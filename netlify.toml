[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# SPA-style fallback is NOT enabled on purpose — every page here is a real
# static .html file (index.html, grievance.html, admin.html), so no redirect
# rules are needed. If you already have a netlify.toml on your site, merge
# the [functions] block below into it instead of overwriting your file.
